    .filters { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 15px; }

    .topic:hover { transform:translateY(-2px); border-color:#b8c7d4; box-shadow:0 12px 24px rgba(15,23,42,.08); }
    .rank { display:grid; place-items:center; width:30px; height:30px; border-radius:6px; background:#f1f5f9; color:var(--muted); font-size:10px; font-weight:900; }

    .topic-visual.health { background:linear-gradient(135deg,#fff4e4,#ffe4bb); color:#a26511; }

    .title { margin:0; color:var(--ink); font-size:13px; line-height:1.45; }
    .tag { flex:0 0 auto; padding:3px 5px; border-radius:4px; background:#eff6ff; color:#3b6b9c; font-size:9px; font-style:normal; }
    .source { margin:5px 0 0; color:#94a3b8; font-size:9px; line-height:1.45; }
    .source a { color:#718096; text-decoration:none; border-bottom:1px dashed #cbd5e1; }
    .source a:hover { color:var(--green); }
    .fact { display:-webkit-box; margin:7px 0 0; overflow:hidden; color:#475569; font-size:10px; line-height:1.55; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .fact b,.angle b { color:var(--green); }
